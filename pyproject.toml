[project]
name = "agentic-cdp"
version = "0.1.0"
description = "Local-first identity-resolution / Customer 360 pipeline with layered matching (rules, probabilistic, LLM agent, human review)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "splink>=4,<5",
    "rapidfuzz>=3.9",
    "networkx>=3.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.40",
    "click>=8.1",
    "pyarrow>=17",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.optional-dependencies]
eval = ["mlflow>=2.16"]

[project.scripts]
cdp = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
